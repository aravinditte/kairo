name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kairo
          POSTGRES_PASSWORD: kairo
          POSTGRES_DB: kairo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kairo -d kairo_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          check-latest: true

      - name: Go vet
        run: go vet ./...

      - name: Go test (unit & PostgreSQL integration)
        env:
          KAIRO_TEST_DATABASE_URL: "postgres://kairo:kairo@localhost:5432/kairo_test?sslmode=disable"
        run: go test -v -race ./...

      - name: Build Kairo API
        run: go build -v ./cmd/kairo-api

      - name: Build Demo Services
        run: go build -v ./services/...

      - name: Build Load Harness
        run: go build -v ./tests/load

  frontend:
    name: Frontend (React & TypeScript)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Vitest suite
        run: npm test

      - name: Production build (Demo mode)
        run: npm run build

      - name: Production build (API mode)
        run: npm run build
        env:
          VITE_DATA_MODE: api
          VITE_API_BASE_URL: http://localhost:8080
